name: Deploy React site to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
      
      - name: Log Install
        run: echo "installed dependencies"
      
      - name: Test
        run: npm test
      
      - name: Log Tests
        run: echo "tests complete"

      - name: Build
        run: npm run build
      
      - name: Log Build
        run: echo "Build Complete"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      
      - name: Log Deployment
        run: echo "Deploy to GitHub Pages complete"